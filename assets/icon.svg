<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect x="8" y="8" width="240" height="240" rx="48" fill="url(#bgGrad)" stroke="#0EA5E9" stroke-width="4" />

  <!-- Outer Security Shield -->
  <path d="M128,42 L200,64 C200,138 160,192 128,212 C96,192 56,138 56,64 Z" fill="rgba(14, 165, 233, 0.12)" stroke="url(#shieldGrad)" stroke-width="6" stroke-linejoin="round" />

  <!-- Email Envelope Shape -->
  <rect x="84" y="94" width="88" height="60" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="4" />
  <polyline points="84,94 128,126 172,94" fill="none" stroke="#38BDF8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Verification Badge -->
  <circle cx="176" cy="164" r="26" fill="#10B981" stroke="#FFFFFF" stroke-width="3" />
  <polyline points="166,164 173,171 187,157" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
</svg>
