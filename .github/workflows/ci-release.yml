name: CI & Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.0', '8.1', '8.2', '8.3']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run PHP Syntax Check
        run: php -l fluentform-email-guard.php

      - name: Run Contract Tests
        run: python3 -m unittest tests/test_email_guard_contract.py

  build-and-release:
    name: Build & Release Package
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Package WordPress Plugin Zip
        run: |
          mkdir -p build/fluentform-email-guard
          cp fluentform-email-guard.php build/fluentform-email-guard/
          cp README.md build/fluentform-email-guard/
          cp LICENSE build/fluentform-email-guard/
          cd build
          zip -r ../fluentform-email-guard.zip fluentform-email-guard
          cd ..
          ls -la fluentform-email-guard.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: fluentform-email-guard.zip
          generate_release_notes: true
          draft: false
          prerelease: false
